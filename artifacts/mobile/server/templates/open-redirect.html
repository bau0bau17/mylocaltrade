<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Opening APP_NAME_PLACEHOLDER…</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background: #0b1120;
        color: #e5e7eb;
      }
      .card {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: #0e1a2a;
        border: 1px solid #1f2b3d;
        border-radius: 20px;
        padding: 40px 28px;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        margin: 0 0 12px;
        color: #ffffff;
      }
      p {
        font-size: 15px;
        line-height: 1.6;
        color: #9ca3af;
        margin: 0 0 20px;
      }
      .btn {
        display: inline-block;
        background: #00b4d8;
        color: #0b1120;
        font-weight: 700;
        font-size: 15px;
        padding: 13px 30px;
        border-radius: 12px;
        text-decoration: none;
      }
      .fallback {
        margin: 24px 0 0;
        font-size: 13px;
      }
      .fallback a {
        color: #00b4d8;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Opening APP_NAME_PLACEHOLDER…</h1>
      <p>If the app doesn't open automatically, tap the button below.</p>
      <a class="btn" id="openBtn" href="DEEP_LINK_PLACEHOLDER">Open in the app</a>
      <p class="fallback">
        Don't have the app yet?
        <a href="https://mylocaltrade.co.uk">Get APP_NAME_PLACEHOLDER</a>
      </p>
    </div>
    <script>
      (function () {
        var deepLink = "DEEP_LINK_PLACEHOLDER";
        // Attempt to launch the installed app straight away. On iOS this shows
        // the "Open in APP_NAME_PLACEHOLDER?" prompt; if the app isn't installed
        // nothing happens and the visible fallback link remains.
        setTimeout(function () {
          window.location.href = deepLink;
        }, 100);
      })();
    </script>
  </body>
</html>
