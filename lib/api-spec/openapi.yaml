openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: MyLocalTrade API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: traders
    description: Trader listing operations
  - name: profile
    description: Trader profile management
  - name: trader
    description: Trader onboarding and self-service
  - name: subscriptions
    description: Subscription and billing
  - name: saved
    description: Saved traders
  - name: enquiries
    description: Enquiries and leads
  - name: trader-documents
  - name: reviews
  - name: categories
    description: Trade categories
  - name: conversations
    description: Customer-trader conversations and messages
  - name: quotes
    description: Structured quotes sent by traders within conversations
  - name: reports
    description: Profile-level reports about a trader or customer
  - name: push-tokens
    description: Mobile push notification token registration
  - name: companies-house
    description: UK Companies House lookups (public)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register/customer:
    post:
      operationId: registerCustomer
      tags: [auth]
      summary: Register a new customer
      description: |
        Creates an inactive customer account and emails a verification link.
        The account cannot sign in until the email is verified. The response
        is a pending-registration acknowledgement, NOT a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterCustomerRequest"
      responses:
        "201":
          description: Account created — verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPendingResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register/trader:
    post:
      operationId: registerTrader
      tags: [auth]
      summary: Register a new trader
      description: |
        Creates an inactive trader account and an associated trader profile,
        then emails a verification link. The trader account becomes
        publicly visible only after a successful subscription payment
        webhook (see /subscriptions/checkout). The response is a
        pending-registration acknowledgement, NOT a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTraderRequest"
      responses:
        "201":
          description: Account created — verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterPendingResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/resend-verification:
    post:
      operationId: resendVerificationEmail
      tags: [auth]
      summary: Resend the email verification link
      description: |
        Resends the email-verification link for an unverified account.
        Always responds 200 with a generic message when the email is unknown
        (to avoid leaking which addresses are registered). Rate-limited to
        one request per 60 seconds per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
      responses:
        "200":
          description: Resend handled (success or already-verified)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Missing email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Cooldown still active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetryAfterErrorResponse"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset code
      description: |
        Sends a 6-digit password reset code to the account's email address.
        Always responds 200 with a generic message regardless of whether the
        email is registered (to avoid leaking which addresses have accounts).
        Works for all account types (customer, trader, admin). Rate-limited to
        one request per 60 seconds per account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Request handled (a code is sent if the account exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Missing or invalid email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset a password with the 6-digit code
      description: |
        Completes the password reset: the user supplies the 6-digit code from
        the reset email plus a new password. On success the password is changed,
        all existing sessions are revoked, and a fresh session is issued (same
        shape as /auth/login), so the user is signed in immediately. If the
        account's email was not yet verified, a successful reset also verifies
        it (the code proves email control).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset — session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid, expired, or incorrect code (uniform response; does not disclose account state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many incorrect attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/verify-email-code:
    post:
      operationId: verifyEmailCode
      tags: [auth]
      summary: Verify an email address with the 6-digit code
      description: |
        Primary in-app email verification flow. The user enters the 6-digit
        code from their verification email and, on success, is signed in
        immediately — the response is a full session (same shape as
        /auth/login), so the mobile UX never has to bounce out to the browser.
        The web-link path (GET /auth/verify-email) remains as a fallback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailCodeRequest"
      responses:
        "200":
          description: Verified — session issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid, expired, or incorrect code (uniform response; does not disclose account state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many incorrect attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trader/onboarding-status:
    get:
      operationId: getTraderOnboardingStatus
      tags: [trader]
      summary: Get the signed-in trader's onboarding/verification status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Onboarding status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderOnboardingStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not a trader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trader profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me/avatar:
    patch:
      operationId: updateAvatar
      tags: [auth]
      summary: Set or remove the current trader's personal profile photo
      description: |
        Traders only. Pass the objectPath returned by the customer-uploads
        presigned upload flow to set the photo, or null to remove it. The
        object must live under the caller's own customer-uploads prefix and be
        a supported image type. This is the personal headshot, NOT the
        business logo (which lives on the trader profile).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAvatarRequest"
      responses:
        "200":
          description: Updated avatar state
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  avatarUrl:
                    type: string
                    nullable: true
                required: [ok]
        "400":
          description: Invalid or unowned image object
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Only traders can set a personal profile photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me/notification-settings:
    patch:
      operationId: updateNotificationSettings
      tags: [auth]
      summary: Update the current user's global notification preferences
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationSettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateNotificationSettingsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trader/lead-reminder-settings:
    get:
      operationId: getLeadReminderSettings
      tags: [trader]
      summary: Get the current trader's lead-reminder delay preference
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadReminderSettings"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a trader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLeadReminderSettings
      tags: [trader]
      summary: Update the current trader's lead-reminder delay preference
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadReminderSettingsRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadReminderSettings"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a trader
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /traders:
    get:
      operationId: listTraders
      tags: [traders]
      summary: List traders with optional search/filter
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: featured
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: verified
          in: query
          description: Only return fully verified traders.
          schema:
            type: boolean
        - name: plan
          in: query
          description: Filter by subscription plan tier.
          schema:
            type: string
            enum: [premium]
        - name: specialism
          in: query
          description: Filter to traders whose main category or additional services match a known specialism keyword (e.g. "solar", "heat pump", "ev charger").
          schema:
            type: string
        - name: sort
          in: query
          description: Result ordering. Default surfaces verified+featured first.
          schema:
            type: string
            enum: [recommended, rating, reviews, newest]
            default: recommended
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of traders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderListResponse"

  /traders/featured:
    get:
      operationId: getFeaturedTraders
      tags: [traders]
      summary: Get featured traders
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Featured traders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderListResponse"

  /traders/{id}:
    get:
      operationId: getTrader
      tags: [traders]
      summary: Get trader by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Trader details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderProfile"
        "404":
          description: Trader not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile:
    get:
      operationId: getTraderProfile
      tags: [profile]
      summary: Get own trader profile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Trader profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateTraderProfile
      tags: [profile]
      summary: Update trader profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTraderProfileRequest"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/revalidate:
    post:
      operationId: revalidateTraderProfile
      tags: [profile]
      summary: Re-confirm key documents are current, resetting the re-validation clock
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Re-validation re-confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevalidateProfileResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Trader profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Profile is not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/plans:
    get:
      operationId: getSubscriptionPlans
      tags: [subscriptions]
      summary: Get available subscription plans
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionPlansResponse"

  /subscriptions/checkout:
    post:
      operationId: createCheckoutSession
      tags: [subscriptions]
      summary: Create Stripe checkout session
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutRequest"
      responses:
        "200":
          description: Checkout session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/status:
    get:
      operationId: getSubscriptionStatus
      tags: [subscriptions]
      summary: Get current subscription status
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatus"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/cancellation-request:
    post:
      operationId: createSubscriptionCancellationRequest
      tags: [subscriptions]
      summary: File a cooling-off / cancellation request (file-and-record only)
      description: |
        Records a structured cancellation request and notifies support. This
        NEVER cancels the subscription and NEVER issues a refund — Apple-owned
        subscriptions are cancelled/refunded by Apple; the app only hands off and
        records the request. Cooling-off eligibility is computed server-side.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCancellationRequest"
      responses:
        "201":
          description: Request filed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationRequestResult"
        "200":
          description: An open request already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancellationRequestResult"
        "400":
          description: No subscription to cancel / invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/demo-activate:
    post:
      operationId: demoActivateSubscription
      tags: [subscriptions]
      summary: Activate subscription in demo mode (no Stripe)
      description: |
        Used only when the API is running without `STRIPE_SECRET_KEY`. The
        client receives a `demoActivationUrl` from `createCheckoutSession`
        and POSTs to this endpoint to flip the pending subscription into
        the `active` state immediately.
      security:
        - bearerAuth: []
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
        - name: planId
          in: query
          required: true
          schema:
            type: string
            enum: [basic, premium]
      responses:
        "200":
          description: Demo subscription activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoActivateResponse"
        "400":
          description: Invalid or already-processed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Demo activation not available in production
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/cancel:
    post:
      operationId: cancelSubscription
      tags: [subscriptions]
      summary: Schedule cancellation at period end
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Cancellation scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionMutationResponse"
        "400":
          description: No active subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /subscriptions/resume:
    post:
      operationId: resumeSubscription
      tags: [subscriptions]
      summary: Undo a scheduled cancellation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription resumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionMutationResponse"
        "400":
          description: No scheduled cancellation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trader/documents:
    get:
      operationId: getTraderDocuments
      tags: [trader-documents]
      summary: List the current trader's verification documents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documents and evaluation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TraderDocumentsResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: registerTraderDocument
      tags: [trader-documents]
      summary: Register a successfully uploaded document
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterTraderDocumentRequest"
      responses:
        "201":
          description: Document registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterTraderDocumentResponse"
        "400":
          description: Invalid document data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /customer/uploads/upload-url:
    post:
      operationId: getCustomerUploadUrl
      tags: [customer-uploads]
      summary: Request a presigned PUT URL for a customer-side image upload (enquiry photos, trader gallery)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCustomerUploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trader/documents/upload-url:
    post:
      operationId: getTraderDocumentUploadUrl
      tags: [trader-documents]
      summary: Request a presigned PUT URL for uploading a document
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trader/documents/{id}:
    delete:
      operationId: deleteTraderDocument
      tags: [trader-documents]
      summary: Delete a pending or rejected trader document
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Document deleted
          content:
            application/json:
              schema:
