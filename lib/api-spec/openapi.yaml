    ConversationSummary:
      type: object
      properties:
        id:
          type: integer
        customerId:
          type: integer
        customerName:
          type: string
        traderProfileId:
          type: integer
        traderBusinessName:
          type: string
        traderAvatarUrl:
          type: string
          nullable: true
          description: |
            Personal profile photo object path of the trader user handling this
            conversation, when they have set one. Only populated on the
            conversation DETAIL response (null in list responses). Load it via
            the authenticated avatar-file endpoint.
        traderVerified:
          type: boolean
        enquiryId:
          type: integer
          nullable: true
        serviceRequired:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        status:
          type: string
          enum: [AWAITING_TRADER_REPLY, AWAITING_CUSTOMER_REPLY, CLOSED, BLOCKED, REPORTED]
        traderStatus:
          type: string
          enum: [NEW, CONTACTED, QUOTED, COMPLETED]
        stage:
          type: string
          enum: [AWAITING_REPLY, HIRED, AWAITING_CUSTOMER_CONFIRMATION, JOB_DONE, CANCELLED, CLOSED]
          description: |
            Derived lifecycle stage, the single source of truth for the headline
            status shown to both parties. Precedence: cancelled > job done >
            awaiting customer confirmation > hired > closed/blocked > awaiting reply.
        unreadCount:
          type: integer
        muted:
          type: boolean
        mutedUntil:
          type: string
          format: date-time
          nullable: true
          description: |
            ISO timestamp when the current mute auto-expires. Null when the
            conversation is unmuted or muted indefinitely.
        lastMessageAt:
          type: string
          format: date-time
        lastMessagePreview:
          type: string
          nullable: true
        closedAt:
          type: string
          format: date-time
          nullable: true
        closedByRole:
          type: string
          nullable: true
        customerAcceptedAt:
          type: string
          format: date-time
          nullable: true
          description: When the customer accepted the trader's offer (hired them). Null until accepted.
        customerCompletedAt:
          type: string
          format: date-time
          nullable: true
          description: When the customer confirmed the job is done. Unlocks leaving a review. Null until confirmed.
        traderMarkedDoneAt:
          type: string
          format: date-time
          nullable: true
          description: When the trader signalled the work is finished. Notifies the customer only; never unlocks the review on its own.
        cancelledAt:
          type: string
          format: date-time
          nullable: true
          description: When the job was cancelled. Cancelled jobs are never review-eligible.
        cancelledByRole:
          type: string
          nullable: true
          description: Who cancelled the job ("customer" or "trader").
        cancellationReason:
          type: string
          nullable: true
          description: The short reason supplied when cancelling.
        reviewUnlockedAt:
          type: string
          format: date-time
          nullable: true
          description: When review submission became eligible (set at customer confirmation).
        jobReference:
          type: string
          nullable: true
          description: |
            Human-readable unique job reference (e.g. MLT-000123), allocated when
            the customer hires the trader. Null until hired. Shown in the chat
            header to both parties; never shown on public reviews.
        hasReview:
          type: boolean
          nullable: true
          description: Whether the customer has already left a review for this job. Only populated on the conversation detail endpoint; null in list responses.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - customerId
        - customerName
        - traderProfileId
        - traderBusinessName
        - traderVerified
        - status
        - traderStatus
        - stage
        - unreadCount
        - muted
        - lastMessageAt
        - createdAt

