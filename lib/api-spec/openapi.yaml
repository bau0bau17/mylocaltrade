          type: integer
          description: Appointment length in minutes (legacy bookings report 60).
        endAt:
          type: string
          format: date-time
          description: Reserved interval end (startAt + duration).
        note:
          type: string
          nullable: true
        status:
          type: string
          enum: [PROPOSED, CONFIRMED, CANCELLED, SUPERSEDED]
        proposedByRole:
