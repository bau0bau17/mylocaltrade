          type: string
          enum: [owner, tenant, landlord, leaseholder]
        urgency:
          type: string
          enum: [routine, soon, urgent]

    Enquiry:
      type: object
      properties:
        id:
          type: integer
        traderId:
          type: integer
        customerId:
          type: integer
        customerName:
          type: string
        customerEmail:
          type: string
          nullable: true
          description: Customer's email. Null until the customer hires the trader (contactUnlocked=false), so contact details are not exposed at the lead stage.
        traderBusinessName:
          type: string
        message:
          type: string
        serviceRequired:
          type: string
        preferredDate:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: Customer's phone. Null until the customer hires the trader (contactUnlocked=false).
        attachmentUrls:
          type: array
          items:
            type: string
        specialistFields:
          allOf:
            - $ref: "#/components/schemas/EnquirySpecialistFields"
          nullable: true
        status:
          type: string
          enum: [pending, responded, closed]
        conversationId:
          type: integer
          nullable: true
        viewedByTrader:
          type: boolean
        contactUnlocked:
          type: boolean
          description: Whether the customer's contact details (email, phone) are revealed to the trader. False until the customer hires the trader.
        traderStatus:
          type: string
          enum: [NEW, CONTACTED, QUOTED, COMPLETED]
          nullable: true
          description: Trader's own lead status from the linked conversation, if one exists.
        stage:
          type: string
          enum: [AWAITING_REPLY, HIRED, AWAITING_CUSTOMER_CONFIRMATION, JOB_DONE, CANCELLED, CLOSED]
          nullable: true
          description: Derived lifecycle stage of the linked conversation, if one exists.
        jobReference:
          type: string
          nullable: true
          description: Human-readable job reference (e.g. MLT-000008). Only set once the customer has hired the trader.
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - traderId
        - customerId
        - customerName
        - customerEmail
