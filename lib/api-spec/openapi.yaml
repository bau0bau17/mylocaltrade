      operationId: traderMarkConversationDone
      tags: [conversations]
      summary: Trader signals the work is finished (notifies the customer to confirm; never unlocks the review)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /conversations/{id}/cancel:
    post:
      operationId: cancelConversationJob
      tags: [conversations]
      summary: Either party cancels the job before completion (a short reason is required)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelConversationRequest"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /conversations/{id}/mute:
    patch:
      operationId: muteConversation
      tags: [conversations]
      summary: Mute or unmute push notifications for this conversation (per user)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MuteConversationRequest"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MuteConversationResponse"

  /conversations/{id}/report:
    post:
      operationId: reportConversation
      tags: [conversations]
      summary: Report a conversation for moderation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportConversationRequest"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [push-tokens]
      summary: Register or refresh an Expo push token for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenRequest"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: unregisterPushToken
      tags: [push-tokens]
      summary: Unregister a push token for the current user
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UnregisterPushTokenRequest"
      responses:
        "200":
          description: Unregistered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /admin/conversation-reports:
    get:
      operationId: getAdminConversationReports
      tags: [conversations]
      summary: Admin — list conversation reports
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, RESOLVED, DISMISSED]
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConversationReportListResponse"

  /admin/conversations/{id}:
    get:
      operationId: getAdminConversation
      tags: [conversations]
      summary: Admin — view conversation (messages only if reported)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Admin conversation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConversationResponse"

  /admin/conversation-reports/{id}/resolve:
    post:
      operationId: resolveAdminConversationReport
      tags: [conversations]
      summary: Admin — resolve, dismiss or block a reported conversation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveReportRequest"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveReportResponse"

  /reports:
    post:
      operationId: createReport
      tags: [reports]
      summary: File a profile-level report (customer reports a trader, trader reports a customer)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReportRequest"
      responses:
        "201":
          description: Report submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
        "400":
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Reported party not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /report-categories:
    get:
      operationId: getReportCategories
      tags: [reports]
      summary: Predefined report reason categories, keyed by the subject being reported
      responses:
        "200":
          description: Report categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportCategoriesResponse"

  /admin/user-reports:
    get:
      operationId: getAdminUserReports
      tags: [reports]
      summary: Admin — list profile-level reports
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [OPEN, RESOLVED, DISMISSED]
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserReportListResponse"

  /admin/user-reports/{id}/resolve:
    post:
      operationId: resolveAdminUserReport
      tags: [reports]
      summary: Admin — resolve or dismiss a profile-level report
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveUserReportRequest"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveReportResponse"

  /companies-house/search:
    get:
      operationId: searchCompaniesHouse
      tags: [companies-house]
      summary: Search the UK Companies House register by name
      description: |
        Public, unauthenticated lookup used during trader registration to
        let the trader pick a confirmed match (which auto-populates address
        and town). Returns up to 6 best matches. Queries shorter than 3
        characters return an empty list.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Company name fragment to search for.
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompaniesHouseSearchResponse"
        "502":
          description: Companies House upstream error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /account/deletion-request:
    post:
      tags: [auth]
      summary: Request account deletion (GDPR)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm]
              properties:
                password: { type: string, minLength: 1 }
                confirm: { type: boolean, enum: [true] }
                reason: { type: string, maxLength: 2000, nullable: true }
      responses:
        "200":
          description: Deletion request accepted
          content:
            application/json:
              schema:
                type: object
                required: [ok, deletionStatus]
                properties:
                  ok: { type: boolean }
                  deletionStatus: { type: string }
                  deletionRequestedAt: { type: string, format: date-time }
                  message: { type: string }
                  token:
                    type: string
                    description: |
                      Fresh JWT bound to the bumped tokenVersion. The mobile
                      client must persist this token immediately after a
                      successful deletion request so the user remains signed
                      in here (other devices were revoked) and can reach the
                      cancel endpoint.
        "401":
          description: Wrong password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Too many failed password attempts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /account/deletion-status:
    get:
      tags: [auth]
      summary: Current GDPR deletion status for the signed-in user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Deletion status snapshot
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletionStatus: { type: string, nullable: true }
                  deletionRequestedAt: { type: string, format: date-time, nullable: true }
                  deletionReason: { type: string, nullable: true }
                  scheduledHardDeleteAt: { type: string, format: date-time, nullable: true }
                  retentionUntil: { type: string, format: date-time, nullable: true }
                  retentionReason: { type: string, nullable: true }
                  canCancel: { type: boolean }

  /account/deletion-cancel:
    post:
      tags: [auth]
      summary: Cancel a pending account deletion request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, confirm]
              properties:
                password: { type: string, minLength: 1 }
                confirm: { type: boolean, enum: [true] }
      responses:
        "200":
          description: Deletion cancelled
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  deletionStatus: { type: string, nullable: true }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    RegisterCustomerRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
      required:
        - email
        - password
        - fullName

    RegisterTraderRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        confirmPassword:
          type: string
          minLength: 8
          description: Must match `password` exactly. Validated server-side.
        termsAccepted:
          type: boolean
          description: User explicitly accepted the current Terms of Service.
        privacyAccepted:
          type: boolean
          description: User explicitly accepted the current Privacy Policy.
        contactName:
          type: string
          minLength: 1
          maxLength: 100
        businessName:
          type: string
        companyNumber:
          type: string
          description: |
            Optional UK Companies House registration number. If present, the
            backend treats the trader as having selected a confirmed match
            from the Companies House live search and skips the manual
            "under review" step for the business identity check.
        vatNumber:
          type: string
          description: |
            Optional UK VAT registration number. When supplied it is checked
            against the HMRC VAT lookup service during review and the result
            is shown to admins alongside the Companies House cross-check.
        phone:
          type: string
        mainCategory:
          type: string
        businessAddress:
          type: string
          description: |
            Street address line(s) of the registered business. When the
            trader picks a Companies House match in the live search, this is
            pre-filled from the company's registered office address.
        town:
          type: string
        postcode:
          type: string
      required:
        - email
        - password
        - confirmPassword
        - termsAccepted
        - privacyAccepted
        - contactName
        - businessName
        - phone
        - mainCategory
        - businessAddress
        - town
        - postcode

    RegisterPendingResponse:
      type: object
      description: |
        Returned by /auth/register/customer and /auth/register/trader. The
        account is created but inactive until the email-verification link is
        followed; for traders, full activation also requires a successful
        subscription payment webhook. No JWT is issued in this response.
      properties:
        message:
          type: string
        email:
          type: string
          format: email
        pollToken:
          type: string
          description: Short-lived token clients may poll with to check verification status.
      required:
        - message
        - email
        - pollToken

    ResendVerificationRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    VerifyEmailCodeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: The 6-digit verification code from the email.
          pattern: "^[0-9]{6}$"
      required:
        - email
        - code

    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    ResetPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        code:
          type: string
          description: The 6-digit password reset code from the email.
          pattern: "^[0-9]{6}$"
        newPassword:
          type: string
          minLength: 8
          description: The new password (minimum 8 characters).
      required:
        - email
        - code
        - newPassword

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message

    RetryAfterErrorResponse:
      type: object
      properties:
        error:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 0
      required:
        - error

    TraderOnboardingChecklistStep:
      type: object
      properties:
        key:
          type: string
        label:
          type: string
        state:
          type: string
          enum: [completed, pending, action_required, locked, rejected, expired]
        description:
          type: string
        comingSoon:
          type: boolean
      required:
        - key
        - label
        - state

    TraderLegalAcceptance:
      type: object
      properties:
        termsCurrent:
          type: string
        termsAccepted:
          type: string
          nullable: true
        termsNeedsReaccept:
          type: boolean
        privacyCurrent:
          type: string
        privacyAccepted:
          type: string
          nullable: true
        privacyNeedsReaccept:
          type: boolean
        needsReaccept:
          type: boolean
      required:
        - termsCurrent
        - termsNeedsReaccept
        - privacyCurrent
        - privacyNeedsReaccept
        - needsReaccept

    TraderOnboardingStatus:
      type: object
      properties:
        verificationStatus:
          type: string
        message:
          type: string
        isPublic:
          type: boolean
        emailVerified:
          type: boolean
        phoneVerified:
          type: boolean
        businessProfileCompleted:
          type: boolean
        documentsSubmitted:
          type: boolean
        isActive:
          type: boolean
        rejectionReason:
          type: string
          nullable: true
        adminNotes:
          type: string
          nullable: true
        needsMoreInfoReason:
          type: string
          nullable: true
        businessRole:
          type: string
          nullable: true
        authorisedRepresentative:
          type: boolean
          nullable: true
        revalidationDueAt:
          type: string
          format: date-time
          nullable: true
        revalidationRemindedAt:
          type: string
          format: date-time
          nullable: true
        revalidationOverdue:
          type: boolean
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/TraderOnboardingChecklistStep"
        legal:
          $ref: "#/components/schemas/TraderLegalAcceptance"
        email:
          type: string
        businessName:
          type: string
      required:
        - verificationStatus
        - message
        - isPublic
        - emailVerified
        - phoneVerified
        - businessProfileCompleted
        - documentsSubmitted
        - isActive
        - checklist
        - email
        - businessName

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"
      required:
        - token
        - user

    UserProfile:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        fullName:
          type: string
        avatarUrl:
          type: string
          nullable: true
          description: |
            Personal profile photo (headshot) object path, e.g.
            /objects/customer-uploads/42/v/uuid. Null when the user has not set
            one. Distinct from the trader's business logo. Served via the
            authenticated avatar-file endpoint; never shown on public trader
            cards.
        role:
          type: string
          enum: [customer, trader, admin]
        isActive:
          type: boolean
        plan:
          type: string
          nullable: true
        pushNotificationsEnabled:
          type: boolean
          description: Global toggle for push notifications across all conversations
        createdAt:
          type: string
          format: date-time
        deletionStatus:
          type: string
          nullable: true
          description: |
            GDPR account-deletion lifecycle stage. Null for normal accounts.
            REQUESTED / DISABLED_PENDING_RETENTION are still cancellable from
            the mobile client. ANONYMISED / COMPLETED are terminal — those
            users cannot reach this endpoint.
        deletionRequestedAt:
          type: string
          format: date-time
          nullable: true
      required:
        - id
        - email
        - fullName
        - role
        - isActive

    UpdateAvatarRequest:
      type: object
      properties:
        objectPath:
          type: string
          nullable: true
          maxLength: 512
          description: |
            Object path from the customer-uploads presigned upload flow
            (/objects/customer-uploads/<userId>/...), or null to remove the
            current photo.
      required: [objectPath]

    UpdateNotificationSettingsRequest:
      type: object
      properties:
        pushNotificationsEnabled:
          type: boolean
      required: [pushNotificationsEnabled]

    UpdateNotificationSettingsResponse:
      type: object
      properties:
        ok:
          type: boolean
        pushNotificationsEnabled:
          type: boolean
      required: [ok, pushNotificationsEnabled]

    LeadReminderSettings:
      type: object
      description: |
        Lead-reminder preferences for a trader. `leadReminderMinutes` is the
        chosen push-reminder delay in minutes; `null` means use the platform
        default (60 minutes); `0` means the push reminder is disabled.
        `leadReminderEmailEnabled` controls the companion email independently:
        when false, no reminder email is sent even if the push reminder fires.
      properties:
        leadReminderMinutes:
          type: integer
          nullable: true
          enum: [0, 30, 60, 180, null]
        defaultMinutes:
          type: integer
          description: The platform default used when leadReminderMinutes is null.
        leadReminderEmailEnabled:
          type: boolean
          description: When false, suppress the lead-reminder email regardless of the push setting.
      required: [leadReminderMinutes, defaultMinutes, leadReminderEmailEnabled]

    UpdateLeadReminderSettingsRequest:
      type: object
      properties:
        leadReminderMinutes:
          type: integer
          nullable: true
          enum: [0, 30, 60, 180, null]
        leadReminderEmailEnabled:
          type: boolean

    ProfileChangeRequestSummary:
      type: object
      description: |
        A pending/decided change to a protected profile field, as seen by the
        requesting user. Created automatically when a protected field is
        edited after the account is established; the live value stays
        unchanged until an admin approves the request.
      properties:
        id:
          type: integer
        field:
          type: string
        fieldLabel:
          type: string
        proposedValue:
          type: string
          nullable: true
        status:
          type: string
          enum: [PENDING, NEEDS_INFO, APPROVED, REJECTED, CANCELLED]
        phoneOtpVerified:
          type: boolean
        adminInfoRequest:
          type: string
          nullable: true
        decisionReason:
          type: string
          nullable: true
        decidedAt:
          type: string
          nullable: true
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - field
        - fieldLabel
        - status
        - createdAt

    TraderProfile:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: integer
        businessName:
          type: string
        contactName:
          type: string
        email:
          type: string
          nullable: true
          description: Null on public trader responses; contact details are only revealed in hired conversations.
        phone:
          type: string
          nullable: true
          description: Null on public trader responses; contact details are only revealed in hired conversations.
        mainCategory:
          type: string
        additionalServices:
          type: array
          items:
            type: string
        businessAddress:
          type: string
          nullable: true
        town:
          type: string
        postcode:
          type: string
        serviceAreas:
          type: array
          items:
            type: string
        businessDescription:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        openingHours:
          type: string
          nullable: true
        workingHours:
          allOf:
            - $ref: "#/components/schemas/WorkingHours"
          nullable: true
        logoUrl:
          type: string
          nullable: true
        galleryUrls:
          type: array
          items:
            type: string
        socialLinks:
          type: object
          nullable: true
          properties:
            facebook:
              type: string
            twitter:
              type: string
            instagram:
              type: string
            linkedin:
              type: string
        businessRole:
          type: string
          enum: [OWNER, DIRECTOR, MANAGER, EMPLOYEE, SELF_EMPLOYED, OTHER]
          nullable: true
        businessType:
          type: string
          enum: [LIMITED_COMPANY, SOLE_TRADER]
          nullable: true
          description: |
            Legal structure of the business. LIMITED_COMPANY requires a
            companyNumber and triggers the automatic Companies House check;
            SOLE_TRADER never requires a company number.
        companyNumber:
          type: string
          nullable: true
          description: |
            UK Companies House registration number. Mandatory only when
            businessType is LIMITED_COMPANY.
        authorisedRepresentative:
          type: boolean
          nullable: true
        businessEmailDomain:
          type: string
          nullable: true
        vatNumber:
          type: string
          nullable: true
        plan:
          type: string
          enum: [basic, premium]
          nullable: true
        isFeatured:
          type: boolean
        isActive:
          type: boolean
        isVerified:
          type: boolean
        verificationStatus:
          type: string
        emailVerified:
          type: boolean
        phoneVerified:
          type: boolean
        businessProfileCompleted:
          type: boolean
        documentsSubmitted:
          type: boolean
        verifiedAt:
          type: string
          format: date-time
          nullable: true
        rating:
          type: number
          nullable: true
        reviewCount:
          type: integer
        responseTimeMinutes:
          type: integer
          nullable: true
          description: Median time (in minutes) from a customer's enquiry to the trader's first reply over the last 90 days. Null if not enough data.
        revalidationDueAt:
          type: string
          format: date-time
          nullable: true
        revalidationRemindedAt:
          type: string
          format: date-time
          nullable: true
        revalidationOverdue:
          type: boolean
        createdAt:
          type: string
          format: date-time
        changeControlActive:
          type: boolean
          description: |
            True once the profile is under change control (submitted for
            review): edits to protected fields become change requests that
            need admin approval instead of applying immediately.
        reviewMessage:
          type: string
          nullable: true
          description: Present on PUT /profile responses when protected fields were routed to admin review.
