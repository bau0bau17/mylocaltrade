    MuteConversationRequest:
      type: object
      properties:
        muted:
          type: boolean
        mutedUntil:
          type: string
          format: date-time
          nullable: true
          description: |
            Optional ISO timestamp when the mute should automatically expire.
            Ignored when `muted` is false. When `muted` is true and this is
            null/omitted, the conversation is muted indefinitely until the
            user manually unmutes it.
      required: [muted]

    MuteConversationResponse:
      type: object
      properties:
        ok:
          type: boolean
        muted:
          type: boolean
        mutedUntil:
          type: string
          format: date-time
          nullable: true
      required: [ok, muted]

