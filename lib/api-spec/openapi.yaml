      type: object
      properties:
        unreadCount:
          type: integer
      required: [unreadCount]

    ConversationListResponse:
      type: object
      properties:
        conversations:
          type: array
          items:
            $ref: "#/components/schemas/ConversationSummary"
        total:
          type: integer
      required: [conversations, total]

    ConversationMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        senderUserId:
          type: integer
          nullable: true
        senderRole:
          type: string
          enum: [customer, trader, admin, system]
        body:
          type: string
        systemMessage:
          type: boolean
        readAt:
          type: string
          format: date-time
          nullable: true
        editedAt:
          type: string
          format: date-time
          nullable: true
        deletedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, conversationId, senderRole, body, systemMessage, createdAt]

    ConversationDetailResponse:
      type: object
      properties:
        conversation:
          $ref: "#/components/schemas/ConversationSummary"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ConversationMessage"
        enquiryAttachments:
          type: array
          description: |
            Short-lived signed GET URLs for the photos the customer attached to
            the original enquiry. Empty when there were none. Both parties to the
            conversation are authorised to view these.
          items:
            type: string
        quotes:
          type: array
          description: |
            All structured quotes in this conversation, newest first, including
            revision history. Both parties to the conversation may view these.
          items:
            $ref: "#/components/schemas/Quote"
        contactDetails:
          nullable: true
          description: |
            Verified contact details for both parties. Only present after the
            customer has accepted a quote or hired the trader; null before hire.
            The backend hire state is the source of truth — contact details are
            never included in pre-hire responses.
          allOf:
            - $ref: "#/components/schemas/ConversationContactDetails"
        booking:
          nullable: true
          description: |
            The live appointment for this conversation (PROPOSED or CONFIRMED),
            if any. Cancelled/superseded bookings are history only and are not
            returned here. Null before hire or when no booking exists.
          allOf:
            - $ref: "#/components/schemas/Booking"
      required: [conversation, messages]

    ConversationContactDetails:
      type: object
      description: |
        Verified contact details for both parties, revealed post-hire.
      properties:
        trader:
          type: object
          properties:
            name:
              type: string
              nullable: true
            businessName:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
        customer:
          type: object
          properties:
            name:
              type: string
              nullable: true
            phone:
              type: string
              nullable: true
            email:
              type: string
              nullable: true

    Quote:
      type: object
      description: |
        A structured quote a trader sent within a conversation. Prices are
        integer pence (minor units). Status is the effective status: quotes
        stored as PENDING whose validUntil has passed are reported as EXPIRED.
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        enquiryId:
          type: integer
          nullable: true
        traderProfileId:
          type: integer
        amountPence:
          type: integer
          description: Quoted price in pence (e.g. 45000 = £450.00).
        priceType:
          type: string
          enum: [FIXED, ESTIMATE]
        description:
          type: string
        notes:
          type: string
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: When the quote expires. Null = no expiry.
        status:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, WITHDRAWN, REVISED, EXPIRED]
        revisionOfQuoteId:
          type: integer
          nullable: true
          description: The quote this one replaced, if it is a revision.
        acceptedAt:
          type: string
          format: date-time
          nullable: true
        declinedAt:
          type: string
          format: date-time
          nullable: true
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - traderProfileId
        - amountPence
        - priceType
        - description
        - status
        - createdAt

    CreateQuoteRequest:
      type: object
      properties:
        amountPence:
          type: integer
          minimum: 1
          maximum: 100000000
          description: Quoted price in pence (e.g. 45000 = £450.00). Max £1,000,000.
        priceType:
          type: string
          enum: [FIXED, ESTIMATE]
        description:
          type: string
          minLength: 3
          maxLength: 2000
          description: What the quoted work includes.
        notes:
          type: string
          maxLength: 1000
          nullable: true
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: Optional expiry. Must be in the future when provided.
      required: [amountPence, priceType, description]

    QuoteResponse:
      type: object
      properties:
        quote:
          $ref: "#/components/schemas/Quote"
      required: [quote]

