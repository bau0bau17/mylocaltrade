          type: string
          minLength: 5
          maxLength: 2000
      required: [reason]

    CancelConversationRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: A short reason for cancelling, recorded in the audit trail.
      required: [reason]

