    AdminConversationResponse:
      type: object
      properties:
        conversation:
          type: object
          properties:
            id:
              type: integer
            customerId:
              type: integer
            customerName:
              type: string
            customerEmail:
              type: string
            traderProfileId:
              type: integer
            traderBusinessName:
              type: string
            status:
              type: string
            traderStatus:
              type: string
            createdAt:
              type: string
              format: date-time
            lastMessageAt:
              type: string
              format: date-time
          required:
            - id
            - customerId
            - customerName
            - customerEmail
            - traderProfileId
            - traderBusinessName
            - status
            - traderStatus
            - createdAt
            - lastMessageAt
        messagesAccessible:
          type: boolean
        quotes:
          type: array
          description: |
            Structured quotes in this conversation (newest first), included only
            when the conversation is accessible to the admin (reported), for
            dispute investigation.
          items:
            $ref: "#/components/schemas/Quote"
        messages:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              senderUserId:
                type: integer
                nullable: true
              senderRole:
                type: string
              body:
                type: string
              systemMessage:
                type: boolean
              createdAt:
                type: string
                format: date-time
            required: [id, senderRole, body, systemMessage, createdAt]
      required: [conversation, messagesAccessible, messages]

